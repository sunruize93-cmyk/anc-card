<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANC Personal Agent</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;color:#172c3d;background:#f5f8fb}textarea,input,select{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 18px;border:1px solid #a9bbc8;border-radius:8px;font:inherit}button{padding:10px 18px;margin:8px 8px 8px 0;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:20px;overflow-wrap:anywhere}label{display:block;font-weight:600}#message{color:#7c2917}</style>
<h1>ANC Personal Agent</h1><p>本机持续排队并调用 Codex。先保存明确范围，再由任务负责人确认；飞书任务请在原卡确认。执行完成后仍需查看产物并验收。</p>
<label>录音任务<select id="tasks"></select></label><pre id="state"></pre><div id="artifacts"></div>
<form id="plan"><label>本轮执行范围<textarea id="instruction" rows="5" required maxlength="6000"></textarea></label><label>允许创建或修改的文件（逗号分隔，仅文件名）<input id="files" required placeholder="README.md, example.mjs"></label><label>验收要求<textarea id="acceptance" rows="3" required maxlength="6000"></textarea></label><p>仅当前任务的隔离目录；禁止网络、外发、部署与安装依赖。修改负责人后必须重新确认。</p><button>保存待确认方案</button></form>
<div id="actions"></div><p id="message" role="status"></p><a href="/">返回录音台账</a>
<script type="module">
let tasks=[], selected;
const $=id=>document.getElementById(id);
const label=s=>({needs_review:'待核对',awaiting:'待负责人确认',queued:'已排队',running:'执行中',review:'待查看产物并验收',interrupted:'执行中断',withdrawn:'已撤回',complete:'已验收',blocked:'待处理缺口'}[s]||s);
async function request(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok)throw Error(data.error);return data}
function render(){selected=tasks.find(t=>t.taskId===$('tasks').value);if(!selected){$('state').textContent='录音转写完成后，任务会出现在此处。';return}const t=selected;const latest=t.rounds.at(-1);const proposal=t.proposal||t.approvedProposal;$('state').textContent=[t.title,`状态：${label(t.status)} · 版本 ${t.version}`,`确认负责人：${t.ownerDisplayName||'待指定'}`,`任务：${t.taskId}`,`来源：${t.transcript.text}`,proposal?`本轮范围：${proposal.action}\n验收要求：${proposal.acceptance}`:'',latest?`最近结果：${latest.summary}\n${latest.verification||''}`:'',t.sessionId?`续跑会话：${t.sessionId}`:''].filter(Boolean).join('\n\n');$('artifacts').replaceChildren();for(const file of latest?.artifacts||[]){const link=document.createElement('a');link.href='/api/tasks/'+t.taskId+'/artifacts/'+encodeURIComponent(file.name);link.textContent='查看产物 '+file.name;link.target='_blank';link.rel='noopener';link.style.marginRight='16px';$('artifacts').append(link)};$('actions').replaceChildren();if(t.ownerOpenId==='local')for(const [kind,label] of [['approve','确认执行'],['recover','恢复原授权'],['accept','确认验收'],['withdraw','撤回授权']]){if(!({approve:['awaiting'],recover:['interrupted'],accept:['review'],withdraw:['awaiting','queued','running','interrupted','review']}[kind].includes(t.status)))continue;const button=document.createElement('button');button.textContent=label;button.onclick=()=>act({kind,proposalId:t.proposal?.id||t.approvedProposal?.id});$('actions').append(button)}}
async function refresh(){const id=$('tasks').value;tasks=await request('/api/tasks');$('tasks').replaceChildren(...tasks.map(t=>{const o=document.createElement('option');o.value=t.taskId;o.textContent=`${t.title} · ${label(t.status)}`;return o}));if(tasks.some(t=>t.taskId===id))$('tasks').value=id;render()}
async function act(action){try{await request('/api/tasks/'+selected.taskId,{version:selected.version,...action});$('message').textContent='已保存。';await refresh()}catch(e){$('message').textContent=e.message;await refresh()}}
$('tasks').onchange=render;$('plan').onsubmit=e=>{e.preventDefault();if(!selected)return;act({kind:'plan',contract:{executor:'codex',instruction:$('instruction').value,files:$('files').value.split(/[,，]/).map(v=>v.trim()),acceptance:$('acceptance').value}})};
refresh().catch(e=>$('message').textContent=e.message);setInterval(()=>refresh().catch(()=>{}),3000);
</script></html>
