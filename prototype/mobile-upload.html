<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANC Card · 手机上传</title>
<style>body{font:17px/1.6 system-ui;background:#f2f5f4;color:#16392f;margin:0;padding:24px}main{max-width:560px;margin:auto}section{background:white;border-radius:16px;padding:20px;margin:18px 0}h1{font-size:28px}h2{font-size:20px}button,input{font:inherit;box-sizing:border-box;max-width:100%;padding:12px;border-radius:9px;border:1px solid #b8ccc4}button{background:#176249;color:white;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}input{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace}small{color:#4d665e}a{color:#176249}#status{white-space:pre-wrap}</style>
<main><h1>把录音送进团队工作流</h1><p>选择已有音频，上传后自动转写并发送到飞书。</p>
<section><h2>1 · 连接你的设备</h2><label for="code">Mac 上显示的 8 位配对码</label><input id="code" inputmode="numeric" autocomplete="off" maxlength="8" type="password"><button id="pair">配对</button><p id="paired" aria-live="polite"></p></section>
<section><h2>2 · 选择录音</h2><input id="file" type="file" accept=".wav,.m4a,.mp3,audio/wav,audio/mp4,audio/mpeg"><small>本轮保持 Safari 在前台，单个文件最多 64 MiB。</small><br><button id="upload" disabled>上传并发送飞书结果</button><p>手机还没有测试音频？</p><button id="sample" disabled>下载 A 卡测试 WAV</button><p><small>下载后保存到“文件”，再从上方选择。此页面还不连接蓝牙录音卡。</small></p></section>
<section><h2>3 · 查看处理结果</h2><p id="status" role="status">等待上传。</p><pre id="receipt"></pre><button id="refresh" disabled>刷新处理状态</button></section>
</main><script src="/upload.js"></script></html>
